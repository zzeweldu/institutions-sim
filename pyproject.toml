[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "institutions-sim"
version = "2.0.0"
description = "Institutional dynamics simulation — policy sandbox, research, and game"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7",
    "dash>=2.17",
    "plotly>=5.22",
    "dash-bootstrap-components>=1.6",
]

[project.scripts]
institutions-sim     = "institutions_sim.web.app:main"
institutions-sim-cli = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["institutions_sim*"]
